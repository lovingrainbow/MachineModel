[package]
name = "model-diff"
version = "0.0.0"
edition = "2021"
publish = false
description = "開發用：把同一批 machine.yaml 餵給 MachineModel 與 DataService 兩份 machine-model，比對診斷與推導結果"

# 兩個同名 crate 會讓 MachineModel 工作區的 `cargo tree -p machine-model` 含糊，
# 所以本工具自成工作區，不屬於 MachineModel 的 members。
[workspace]

[dependencies]
mm = { path = "../../machine-model", package = "machine-model" }
ds = { path = "../../../DataService/crates/machine-model", package = "machine-model" }
